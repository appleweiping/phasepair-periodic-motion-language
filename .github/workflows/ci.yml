name: data-free core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Windows Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12.0"
            install_target: ".[test]"
            pytest_args: "--deselect=tests/test_phasepair_core_batching_readiness.py::ReadinessTests::test_signal_runtime_and_fake_torch_observation"
          - python: "3.14.5"
            install_target: ".[signal,test]"
            pytest_args: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --disable-pip-version-check -e "${{ matrix.install_target }}"
      - name: Audit the public tree
        run: python scripts/public_release_audit.py
      - name: Verify tracked-file manifest
        run: python scripts/release_manifest.py verify
      - name: Verify local Markdown links
        run: python scripts/check_local_links.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test
        run: python -B -m pytest -p no:cacheprovider -q ${{ matrix.pytest_args }}
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  portable-audit:
    name: Ubuntu public-tree and wheel audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: pip
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Audit the public tree
        run: python scripts/public_release_audit.py
      - name: Verify tracked-file manifest
        run: python scripts/release_manifest.py verify
      - name: Verify local Markdown links
        run: python scripts/check_local_links.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Build wheel without runtime dependency resolution
        run: python -m pip wheel --no-deps --wheel-dir dist .
