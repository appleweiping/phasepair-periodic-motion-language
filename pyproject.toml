[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phasepair-core"
version = "0.1.0"
description = "Data-free core for periodic relational skeleton-motion and language research"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "PhasePair contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.10,<2.13",
]

[project.optional-dependencies]
# The exact signal oracle is presently qualified on Windows x86-64 only.
# Linux installs remain useful for audits/builds but are not an oracle PASS.
signal = [
  "numpy==2.4.6",
  "torch==2.12.0",
]
clip = [
  "requests==2.34.2",
  "transformers==4.57.3",
]
test = [
  "pytest==9.0.3",
  "ruff==0.15.22",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
